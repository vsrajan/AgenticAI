# test cluster overrides. From test upward: exact CORS origin, no
# stream file. ONE replica of the one workload -- in-memory sessions,
# see deploy/chart/values.yaml. Placeholders <...> are filled during
# AKS onboarding. No secrets here, ever.

image:
  registry: "<registry-base>"

serviceAccount:
  workloadIdentity:
    clientId: "<test-managed-identity-client-id>"

keyVault:
  name: "<test-key-vault-name>"
  tenantId: "<tenant-id>"

mcp:
  parquet:
    storageAccount: "<test-storage-account>"
    container: "<test-container>"

agent:
  replicas: 1
  azureOpenAI:
    endpoint: "<https://test-aoai-resource.openai.azure.com/>"
    deployment: "<gpt-4o-deployment-name>"
  corsOrigins: "<https://webclient-test.internal.example.com>"
  streamFile: ""

ingress:
  host: "<agnes-test.internal.example.com>"
  tlsSecretName: "<test-tls-secret>"
