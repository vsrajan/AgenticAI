# prod cluster overrides. ONE replica of the single workload, fixed
# by the in-memory session store rather than by load: a second pod
# cannot see the first pod's sessions. Scaling out needs Redis first
# (docs/single-agent.md), and then Azure OpenAI TPM quota is the next
# ceiling -- turns are IO-bound on it. There is no separate MCP tier
# to scale either; the server is a child process of the agent pod.
# Placeholders <...> are filled during AKS onboarding. No secrets ever.

image:
  registry: "<registry-base>"

serviceAccount:
  workloadIdentity:
    clientId: "<prod-managed-identity-client-id>"

keyVault:
  name: "<prod-key-vault-name>"
  tenantId: "<tenant-id>"

mcp:
  parquet:
    storageAccount: "<prod-storage-account>"
    container: "<prod-container>"

agent:
  replicas: 1
  azureOpenAI:
    endpoint: "<https://prod-aoai-resource.openai.azure.com/>"
    deployment: "<gpt-4o-deployment-name>"
  corsOrigins: "<https://webclient.internal.example.com>"
  streamFile: ""

ingress:
  host: "<agnes.internal.example.com>"
  tlsSecretName: "<prod-tls-secret>"
