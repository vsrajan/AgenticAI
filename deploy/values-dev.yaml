# dev cluster overrides. Placeholders marked <...> are filled during
# AKS onboarding (docs/deploy.md section 6); everything else falls
# back to deploy/chart/values.yaml. No secrets here, ever -- the two
# secret values live in the dev Key Vault.

image:
  # Phase B: registry.gitlab.com/<group>/<project> or firm ACR
  registry: "<registry-base>"
  # tag comes from the pipeline: --set image.tag=$CI_COMMIT_SHORT_SHA

serviceAccount:
  workloadIdentity:
    clientId: "<dev-managed-identity-client-id>"

keyVault:
  name: "<dev-key-vault-name>"
  tenantId: "<tenant-id>"

mcp:
  parquet:
    storageAccount: "<dev-storage-account>"
    container: "<dev-container>"

agent:
  # 1, like every other environment: sessions are in-memory, so a
  # second replica would answer a user from a pod that never saw their
  # session. The old dev-only 2 existed for the in-cluster P3.1 check
  # (kill a pod mid-conversation, session continues on the other) --
  # that check needs Redis and comes back with it.
  replicas: 1
  # smallest footprint that still fits BOTH halves in one container --
  # the agent plus its MCP child, which extracts PDFs and opens DuckDB
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  azureOpenAI:
    endpoint: "<https://dev-aoai-resource.openai.azure.com/>"
    deployment: "<gpt-4o-deployment-name>"
  # permissive CORS + the per-node execution log, dev only
  corsOrigins: "*"
  streamFile: "agent_api_stream.txt"

ingress:
  host: "<agnes-dev.internal.example.com>"
  tlsSecretName: ""

pdb:
  # off everywhere at one replica -- see the note in the chart's
  # values.yaml: a budget over a single pod blocks node drains
  enabled: false
