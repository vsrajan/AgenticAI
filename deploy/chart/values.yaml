# Defaults + documentation for every knob. Per-environment overrides
# live in deploy/values-{dev,test,uat,prod}.yaml -- keep those small;
# anything not overridden falls back to here.
#
# THIS BRANCH deploys ONE workload. The agent runs the MCP server as a
# child process over stdio, so there is no mcp Deployment, Service,
# HPA or NetworkPolicy, and no MCP bearer token anywhere. Why:
# docs/single-container-stdio.md. The route back to the split topology
# is section 10 of that doc.
#
# The rule from docs/deploy.md section 6 still holds:
#   secret            -> the environment's Key Vault (secretproviderclass.yaml)
#   varies per env    -> the values file
#   topology truth    -> fixed in the templates
#
# Values files are plain YAML in git. They hold NO secrets, ever.

image:
  # registry base for OUR image -- the firm's internal registry, e.g.
  # registry.internal.example.com/<group> (the Phase B decision,
  # deploy.md s2). Local podman smoke tests need no registry at all.
  registry: ""
  # ONE image now: both projects in one container (Dockerfile at the
  # repo root, built with the repo root as context).
  repository: agnes
  # always deploy a git SHA; the pipeline passes
  # --set image.tag=$CI_COMMIT_SHORT_SHA. Never promote latest.
  tag: ""
  pullPolicy: IfNotPresent
  # name of an existing imagePullSecret in the namespace; "" when the
  # cluster pulls anonymously or via kubelet identity (AcrPull)
  pullSecret: ""

serviceAccount:
  # with workload identity enabled, this annotation binds the
  # user-assigned managed identity that reads Key Vault (CSI driver)
  # and the parquet storage account (initContainer) -- the keyless
  # direction from docs/aks.md section 8.
  name: agnes
  workloadIdentity:
    enabled: true
    # client id of the user-assigned managed identity federated to this
    # service account. Needs: Key Vault get on secrets, Storage Blob
    # Data Reader on the parquet storage account.
    clientId: ""

keyVault:
  # the environment's Azure Key Vault (one per cluster). THREE secrets
  # now -- object names are fixed in secretproviderclass.yaml:
  #   azure-openai-api-key, agent-api-token, redis-url
  # (mcp-server-token and mcp-auth-tokens are gone with the HTTP hop)
  name: ""
  tenantId: ""

agent:
  # the only replica count in the chart. Both halves scale together:
  # more replicas means more MCP servers too, each with its own staged
  # parquet and its own DuckDB file. 2-3 is the aks.md figure, made
  # legal by P3.1's shared Redis sessions. In-process session mode with
  # replicas > 1 is the one forbidden combination.
  replicas: 2
  # sized for BOTH halves, since they share one container's budget:
  # roughly the old agent (0.5 CPU / 1Gi) plus the old MCP tier
  # (0.5 CPU / 512Mi). The MCP child has its own interpreter and its
  # own GIL, so the two do not contend for one lock -- but they do
  # share this limit. Re-set from real measurement (work item 7).
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 3Gi
  azureOpenAI:
    # per-environment resource + quota; the API key is in Key Vault
    endpoint: ""
    deployment: ""
    apiVersion: "2024-12-01-preview"
  # comma-separated CORS allowlist; permissive in dev, the exact web
  # origin from test upward
  corsOrigins: "*"
  # per-node execution log file; "" disables it (recommended from test
  # upward -- P4 in docs/PerformanceRecommendations.md)
  streamFile: ""
  sessionTtlMinutes: "60"
  maxSessions: "500"
  # distributed turn-lock TTL; must exceed the longest realistic turn
  # -- see docs/P3.1.md section 14 before changing
  lockTimeoutSeconds: "300"
  # conversation-window trimming (docs/PerformanceRecommendations.md)
  keepLastNMsgs: "20"
  maxToolContentLen: "80000"
  redis:
    # Redis lives OUTSIDE the cluster (Azure Cache for Redis; plain
    # RESP over TCP, rediss:// for TLS on 6380). The URL embeds the
    # access key, so it arrives from Key Vault, never from a values
    # file. false = in-process sessions -- then agent.replicas MUST be
    # 1 and sessions die on restart.
    enabled: true

# MCP settings still apply -- they are read by the CHILD PROCESS, which
# inherits the container's environment. What is gone is the MCP tier's
# own scaling: no replicas, no resources, no HPA, because there is no
# separate workload to scale.
mcp:
  logLevel: INFO
  # background staleness check interval (minutes); a reload happens
  # only when the staged source actually changed
  dataRefreshMinutes: "15"
  # datasets larger than this get no BM25 index (P0 size gate)
  searchMaxRows: "50000"
  parquet:
    # runtime-staged parquet data (docs/P0.md section 11.9): an
    # initContainer downloads the Spark exports onto an emptyDir
    # mounted at /data before the container starts. It moved onto the
    # agent pod with the MCP server, so every agent replica stages its
    # own copy. false = csv mode from the baked docs dir.
    enabled: true
    storageAccount: ""
    container: ""
    # blob prefix inside the container to download (matches the export
    # layout: <prefix>/Resource.parquet/part-*.parquet ...)
    prefix: "export"
    # dataset map handed to the server. ABSOLUTE container paths on the
    # /data volume -- the parquet lesson: never relative. A directory
    # auto-expands to dir/*.parquet and marker files are skipped.
    # NOTE the exact export names: Resource.parquet and
    # Entitlement.parquet, both SINGULAR, capitalised. The dataset
    # NAMES the agent sees are the plurals on the left.
    sources: "Resources=/data/export/Resource.parquet,Entitlements=/data/export/Entitlement.parquet"
    # image that runs the az download. PLACEHOLDER: replace with the
    # firm's internal registry path, and pin to a firm-approved tag.
    stagingImage: "registry.internal.example.com/azure-cli:2.64.0"

ingress:
  enabled: true
  className: nginx
  # e.g. agnes-dev.internal.example.com -> agnes.internal.example.com
  host: ""
  # existing TLS secret in the namespace; "" uses the ingress
  # controller's default certificate
  tlsSecretName: ""
  # extra annotations merged over the SSE defaults the template sets
  # (proxy-buffering off, 300 s read/send timeouts)
  annotations: {}

pdb:
  # keep at least one pod through voluntary disruptions (node drains);
  # pointless with a single replica, so dev turns it off
  enabled: true
