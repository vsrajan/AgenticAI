# Key Vault -> k8s Secret mapping (Secrets Store CSI driver, Azure
# provider). The vault object names below are FIXED -- create them with
# exactly these names in every environment's vault (docs/deploy.md
# section 6). Mounting the CSI volume in a pod is what triggers the
# sync of the k8s Secret.
#
# THREE secrets on this branch, not five. mcp-server-token and
# mcp-auth-tokens are gone: stdio has no HTTP layer to authenticate, so
# there is no token to mint, store or rotate for the MCP hop. That is
# the whole point of the topology (docs/single-container-stdio.md s2).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-kv
  labels:
    {{- include "agnes.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    {{- if .Values.serviceAccount.workloadIdentity.enabled }}
    clientID: {{ .Values.serviceAccount.workloadIdentity.clientId | quote }}
    {{- end }}
    keyvaultName: {{ required "set keyVault.name" .Values.keyVault.name | quote }}
    tenantId: {{ required "set keyVault.tenantId" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: agent-api-token
          objectType: secret
        {{- if .Values.agent.redis.enabled }}
        - |
          objectName: redis-url
          objectType: secret
        {{- end }}
  # the synced Secret the Deployments read env vars from
  secretObjects:
    - secretName: {{ include "agnes.secretName" . }}
      type: Opaque
      data:
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: agent-api-token
          key: AGENT_API_TOKEN
        {{- if .Values.agent.redis.enabled }}
        - objectName: redis-url
          key: REDIS_URL
        {{- end }}
