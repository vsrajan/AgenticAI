# ONE ConfigMap for the whole pod. The MCP server is a child process of
# the agent and inherits its environment, so the server's settings live
# here alongside the agent's -- there is no second workload and no .env
# in the image (docs/single-container-stdio.md section 5).
#
# Topology truths are literal; per-environment knobs come from values.
# Secrets never appear here -- they are in
# {{ include "agnes.secretName" . }} via the Key Vault CSI driver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agnes.agentName" . }}-config
  labels:
    {{- include "agnes.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  # -- agent: topology truths --
  AGENT_API_HOST: "0.0.0.0"
  AGENT_API_PORT: "8080"
  AGENT_API_AUTH: "static"

  # -- how the agent starts the MCP server --
  # stdio: no port, no listener, nothing to authenticate. The image
  # already sets these; repeated here so the deployed configuration is
  # readable in one place and overridable without a rebuild.
  MCP_TRANSPORT: "stdio"
  MCP_SERVER_COMMAND: "uv"
  MCP_SERVER_ARGS: "run --no-sync --project /app/mcp-server mcp-docs-server"

  # -- MCP server: topology truths (read by the child) --
  MCP_DOCS_DIR: "/app/mcp-server/docs"      # baked into the image
  MCP_DB_PATH: "/duckdb/mcp_data.duckdb"    # emptyDir, NOT the image layer
  {{- if .Values.mcp.parquet.enabled }}
  MCP_DATA_SOURCE: "parquet"
  # ABSOLUTE container paths on the initContainer-staged /data volume
  MCP_PARQUET_SOURCES: {{ .Values.mcp.parquet.sources | quote }}
  {{- else }}
  MCP_DATA_SOURCE: "csv"
  {{- end }}

  # -- per-environment knobs --
  AZURE_OPENAI_ENDPOINT: {{ required "set agent.azureOpenAI.endpoint" .Values.agent.azureOpenAI.endpoint | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ required "set agent.azureOpenAI.deployment" .Values.agent.azureOpenAI.deployment | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.agent.azureOpenAI.apiVersion | quote }}
  AGENT_API_CORS_ORIGINS: {{ .Values.agent.corsOrigins | quote }}
  AGENT_API_STREAM_FILE: {{ .Values.agent.streamFile | quote }}
  AGENT_API_SESSION_TTL_MINUTES: {{ .Values.agent.sessionTtlMinutes | quote }}
  AGENT_API_MAX_SESSIONS: {{ .Values.agent.maxSessions | quote }}
  AGENT_API_LOCK_TIMEOUT_SECONDS: {{ .Values.agent.lockTimeoutSeconds | quote }}
  KEEP_LAST_N_MSGS: {{ .Values.agent.keepLastNMsgs | quote }}
  MAX_TOOL_CONTENT_LEN: {{ .Values.agent.maxToolContentLen | quote }}
  MCP_LOG_LEVEL: {{ .Values.mcp.logLevel | quote }}
  MCP_DATA_REFRESH_MINUTES: {{ .Values.mcp.dataRefreshMinutes | quote }}
  MCP_SEARCH_MAX_ROWS: {{ .Values.mcp.searchMaxRows | quote }}
