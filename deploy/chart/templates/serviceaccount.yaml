# one service account for both Deployments. The workload identity
# annotation binds the user-assigned managed identity that the CSI
# driver (Key Vault) and the parquet initContainer (Storage) use --
# no secrets stored for either. See docs/aks.md section 8.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "agnes.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "set serviceAccount.workloadIdentity.clientId" .Values.serviceAccount.workloadIdentity.clientId | quote }}
  {{- end }}
