# GitLab CI: test -> build -> deploy (docs/deploy.md section 7).
#
# The promotion invariant: every deploy job uses the SAME image
# (tagged $CI_COMMIT_SHORT_SHA) and the SAME chart -- only the values
# file differs per environment. Nothing is rebuilt between clusters.
#
# Environment-scoped CI/CD variables expected (Settings -> CI/CD ->
# Variables, each scoped to its environment name):
#   AZ_CLIENT_ID / AZ_CLIENT_SECRET / AZ_TENANT  -- deploy SP per env
#   AKS_CLUSTER / AKS_RG                         -- target cluster per env
# Prefer GitLab-Azure OIDC federation (id_tokens -> Entra workload
# identity federation) over stored SP secrets when the firm supports
# it -- same keyless direction as the rest of the auth roadmap.
#
# Registry note (Phase B, docs/deploy.md section 2): REGISTRY_BASE
# defaults to this project's GitLab Container Registry, for which the
# job token below just works. Point it at a firm ACR instead by
# overriding REGISTRY_BASE + REGISTRY_USER + REGISTRY_PASSWORD.
#
# Image note: every image here -- the two job images, the kaniko
# executor, the azure-cli deploy image, and the Dockerfile's base --
# comes from the firm's INTERNAL registry. The values below are
# PLACEHOLDERS; replace them once, here, with the real paths. They are
# variables rather than literals so a registry move is one edit.
#
# Do not assume public egress: the extensions.duckdb.org lesson is to
# treat anything outside the firm's network as blocked until proven
# otherwise. The image builds also need a PyPI index reachable from
# the runners -- see the note in the root Dockerfile.

stages: [test, build, deploy]

variables:
  REGISTRY_BASE: $CI_REGISTRY_IMAGE
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD

  # -- PLACEHOLDERS: internal registry paths --
  # BASE_IMAGE must carry Python 3.12 (mcp-server/.python-version).
  BASE_IMAGE: registry.internal.example.com/python:3.12-slim
  UV_IMAGE: registry.internal.example.com/astral-sh/uv:python3.12-bookworm
  KANIKO_IMAGE: registry.internal.example.com/kaniko-project/executor:debug
  AZCLI_IMAGE: registry.internal.example.com/azure-cli:latest
  # internal PyPI mirror for the one pip call in the image build.
  # Leave empty where PyPI is reachable -- pip ignores an empty value.
  # The uv sync runs need no index: --frozen fetches the exact URLs
  # recorded in uv.lock, which must therefore be generated inside this
  # network (a lock full of files.pythonhosted.org URLs is unusable
  # where PyPI is blocked).
  PIP_INDEX_URL: ""

# -- test: the same suites run at every feature checkpoint --

test:mcp:
  stage: test
  image: $UV_IMAGE
  script:
    - cd mcp-server
    - uv run --with pytest pytest tests/ -q

test:agent:
  stage: test
  image: $UV_IMAGE
  script:
    - cd agent-client
    - uv run --with pytest --with httpx --with 'fakeredis[lua]' pytest tests_api/ -q

# -- build: daemonless image builds (kaniko), git-SHA tagged --

.kaniko: &kaniko
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      printf '{"auths":{"%s":{"auth":"%s"}}}'
      "$CI_REGISTRY"
      "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      > /kaniko/.docker/config.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ONE image carrying both projects. The agent runs the MCP server as a
# child process over stdio, so they have to share a filesystem -- see
# docs/single-container-stdio.md section 3. Note the context is the
# REPO ROOT, not a project directory: the Dockerfile copies from both
# mcp-server/ and agent-client/.
#
# The destination must match what the chart renders from
# image.registry + image.repository (agnes) -- see agnes.image in
# _helpers.tpl. A mismatch here is an ImagePullBackOff at deploy time,
# not a build failure.
build:image:
  <<: *kaniko
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg BASE_IMAGE="$BASE_IMAGE"
      --build-arg PIP_INDEX_URL="$PIP_INDEX_URL"
      --destination "$REGISTRY_BASE/agnes:$CI_COMMIT_SHORT_SHA"

# -- deploy: same chart + same SHA through all four clusters --

.deploy: &deploy
  stage: deploy
  image: $AZCLI_IMAGE
  before_script:
    # az is in the image; add kubectl+kubelogin (az aks install-cli)
    # and a pinned helm.
    #
    # get.helm.sh is PUBLIC egress and has been observed returning 403
    # from inside the firm's network. If it is blocked, bake helm and
    # kubectl into an internal deploy image and drop these three lines
    # -- do not work around it by resolving helm at deploy time from
    # somewhere unpinned.
    - az aks install-cli
    - curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/helm
  script:
    - az login --service-principal -u "$AZ_CLIENT_ID" -p "$AZ_CLIENT_SECRET" -t "$AZ_TENANT" -o none
    - az aks get-credentials -n "$AKS_CLUSTER" -g "$AKS_RG" --overwrite-existing
    # AAD-enabled clusters need kubeconfig converted to the azurecli
    # credential flow (no device-code prompt in CI)
    - kubelogin convert-kubeconfig -l azurecli
    - helm upgrade --install agnes deploy/chart
      -f "deploy/values-$CI_ENVIRONMENT_NAME.yaml"
      --set image.tag="$CI_COMMIT_SHORT_SHA"
      --set image.registry="$REGISTRY_BASE"
      --namespace agnes --create-namespace
      --wait --timeout 10m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:dev:
  <<: *deploy
  environment:
    name: dev

deploy:test:
  <<: *deploy
  environment:
    name: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:uat:
  <<: *deploy
  environment:
    name: uat
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:prod:
  <<: *deploy
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
