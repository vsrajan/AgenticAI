<!DOCTYPE html>
<!--
  POC single-page web client for the Agent API (streaming model).

  How to use:
    1. start the MCP server and the API server (see README_api.md)
    2. open this file directly in a browser (no web server needed)
    3. set the token below (or pass it in the url:
       webclient_api.html?token=your-secret-token)

  How it works: EventSource, the browser's built-in SSE client, only
  supports GET requests -- but our stream endpoint is a POST with a JSON
  body and an Authorization header. So this page uses fetch() instead
  and reads the response body incrementally, parsing the SSE text
  format by hand (see readSseStream below).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Access Governance Agent -- POC client</title>
<style>
  /* minimal chat layout: header / scrolling messages / input row */
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 760px; margin: 0 auto; padding: 16px;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #status { color: #666; font-size: 13px; min-height: 18px; font-style: italic; }
  #messages {
    flex: 1; overflow-y: auto; border: 1px solid #ddd;
    border-radius: 8px; padding: 12px; margin: 8px 0;
  }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px;
         white-space: pre-wrap; word-wrap: break-word; }
  .msg.user      { background: #d6e4f0; margin-left: 15%; }
  .msg.assistant { background: #f1f3f5; margin-right: 15%; }
  .msg.error     { background: #ffe3e3; color: #c92a2a; }
  #inputRow { display: flex; gap: 8px; }
  #question { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px;
           background: #2b579a; color: white; cursor: pointer; }
  button:disabled { background: #aaa; cursor: wait; }
</style>
</head>
<body>

<h1>Access Governance Agent -- POC client</h1>
<div id="status"></div>
<div id="messages"></div>
<div id="inputRow">
  <input id="question" placeholder="Ask a question..." autofocus>
  <button id="send">Send</button>
</div>

<script>
"use strict";

// -- configuration --
// the token is assumed to be available to this page (POC). Edit the
// defaults here, or override per-browser-tab via url query params:
//   webclient_api.html?token=your-secret-token&base=http://127.0.0.1:8080
const params   = new URLSearchParams(location.search);
const API_BASE = params.get("base")  || "http://127.0.0.1:8080";
const TOKEN    = params.get("token") || "change-me";

// every request carries the bearer token (see docs/agent_api.md section 6)
const AUTH_HEADERS = {
  "Authorization": "Bearer " + TOKEN,
  "Content-Type": "application/json",
};

// -- tiny dom helpers --
const statusEl   = document.getElementById("status");
const messagesEl = document.getElementById("messages");
const questionEl = document.getElementById("question");
const sendEl     = document.getElementById("send");

function addMessage(cssClass, text) {
  const div = document.createElement("div");
  div.className = "msg " + cssClass;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;  // caller keeps the node to append streamed tokens into
}

// -- session handling --
// the api keeps conversation history per session id, so we create one
// session on the first message and reuse it for every message after
let sessionId = null;

async function ensureSession() {
  if (sessionId) return sessionId;
  const resp = await fetch(API_BASE + "/sessions", {
    method: "POST",
    headers: AUTH_HEADERS,
  });
  if (!resp.ok) throw new Error("create session failed: HTTP " + resp.status);
  sessionId = (await resp.json()).session_id;
  return sessionId;
}

// -- sse parsing --
// the stream endpoint answers with text/event-stream: blocks of
//   event: token
//   data: {"data": "Hello"}
// separated by a blank line. fetch gives us the body as raw bytes, so
// we decode chunks as they arrive, split on the blank-line separator,
// and call onEvent(type, data) for each complete block.
async function readSseStream(response, onEvent) {
  const reader  = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    // stream:true because a multi-byte character can be split across
    // two network chunks -- the decoder holds the partial bytes
    buffer += decoder.decode(value, { stream: true });

    // a complete event ends with a blank line; keep the (possibly
    // incomplete) remainder in the buffer for the next chunk
    const blocks = buffer.split("\n\n");
    buffer = blocks.pop();

    for (const block of blocks) {
      let eventType = "message";
      let data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event: ")) eventType = line.slice(7);
        else if (line.startsWith("data: ")) data = line.slice(6);
      }
      if (data) onEvent(eventType, JSON.parse(data).data);
    }
  }
}

// -- main send flow --
async function send() {
  const question = questionEl.value.trim();
  if (!question) return;
  questionEl.value = "";
  sendEl.disabled = true;
  addMessage("user", question);

  // the assistant bubble starts empty and fills up token by token
  const bubble = addMessage("assistant", "");

  try {
    let sid = await ensureSession();
    statusEl.textContent = "Connecting...";

    const post = () => fetch(
      API_BASE + "/sessions/" + sid + "/messages/stream",
      {
        method: "POST",
        headers: AUTH_HEADERS,
        body: JSON.stringify({ message: question }),
      },
    );

    let resp = await post();
    if (resp.status === 404) {
      // the server evicts idle sessions (TTL) -- ours expired, so
      // start a fresh one and retry once. Conversation context is
      // gone, but the message still gets answered.
      sessionId = null;
      sid = await ensureSession();
      resp = await post();
    }
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    await readSseStream(resp, (type, data) => {
      if (type === "phase") {
        // e.g. "Routing", "Calling tools" -- shown while we wait
        statusEl.textContent = data + "...";
      } else if (type === "token") {
        bubble.textContent += data;          // live typing effect
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (type === "answer") {
        bubble.textContent = data;           // full text, authoritative
      } else if (type === "error") {
        bubble.className = "msg error";
        bubble.textContent = data;
      }
    });
  } catch (err) {
    bubble.className = "msg error";
    bubble.textContent = "Request failed: " + err.message +
      " -- is the API server running, and is the token correct?";
  } finally {
    statusEl.textContent = "";
    sendEl.disabled = false;
    questionEl.focus();
  }
}

sendEl.addEventListener("click", send);
questionEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
