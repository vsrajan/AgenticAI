[project]
name = "agent-client"
version = "0.1.0"
description = "LangGraph ReAct agent for Access Governance, powered by AzureOpenAI and MCP"
requires-python = ">=3.10"
dependencies = [
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent-client = "agent_client.cli:main"
scan-cli = "agent_client.scanner_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
