[project]
name = "agent-client"
version = "0.1.0"
description = "LangGraph ReAct agent for Access Governance, powered by AzureOpenAI and MCP"
requires-python = ">=3.10"
dependencies = [
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
agent-client = "ease_clients.cli:main"
scan-cli = "ease_clients.scanner_cli:main"
agent-api = "ease_clients.cli_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ease_clients"]
