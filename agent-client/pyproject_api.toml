# Manifest for the agent API layer.
#
# uv and pip only recognize the literal filename pyproject.toml, so to
# run the API activate this manifest and sync:
#     cd agent-client
#     cp pyproject_api.toml pyproject.toml
#     uv sync
#     uv run agent-api
#
# This file is a complete superset of pyproject.toml -- same
# dependencies and scripts plus fastapi/uvicorn and the agent-api entry
# point -- so the CLI (agent-client) and scanner (scan-cli) keep working
# from the same environment.
#
# Restore the original manifest with: git checkout pyproject.toml

[project]
name = "agent-client"
version = "0.1.0"
description = "LangGraph ReAct agent for Access Governance, powered by AzureOpenAI and MCP"
requires-python = ">=3.10"
dependencies = [
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
agent-client = "agent_client.cli:main"
scan-cli = "agent_client.scanner_cli:main"
agent-api = "agent_client.cli_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
